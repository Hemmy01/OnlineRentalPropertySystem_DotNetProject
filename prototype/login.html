<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login – PropRent</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="logo">Prop<span>Rent</span></div>
      <div class="subtitle">South Africa's Property Platform</div>
      <h2>Welcome Back</h2>

      <div id="errorMsg" style="display:none;background:#fce8e8;color:var(--danger);padding:0.7rem 1rem;border-radius:7px;font-size:0.88rem;margin-bottom:1rem;"></div>

      <form onsubmit="handleLogin(event)">
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="loginEmail" placeholder="you@example.com" required />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="loginPassword" placeholder="••••••••" required />
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.2rem;font-size:0.85rem;">
          <label style="display:flex;align-items:center;gap:0.4rem;cursor:pointer;"><input type="checkbox" /> Remember me</label>
          <a href="#" style="color:var(--primary);">Forgot password?</a>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Login</button>
      </form>

      <div class="divider-text">or</div>

      <div style="font-size:0.82rem;background:var(--light);border-radius:7px;padding:0.8rem;color:var(--gray);margin-bottom:1rem;">
        <strong>Demo Accounts:</strong><br/>
        Tenant: john@example.com / password123<br/>
        Admin: admin@proprent.co.za / admin123
      </div>

      <div class="auth-switch">Don't have an account? <a href="register.html">Register here</a></div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (DB.currentUser) window.location.href = 'dashboard.html';
    });

    function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;
      const user = login(email, password);
      if (user) {
        showToast(`Welcome back, ${user.name.split(' ')[0]}!`, 'success');
        const redirect = new URLSearchParams(window.location.search).get('redirect');
        setTimeout(() => { window.location.href = redirect || 'dashboard.html'; }, 600);
      } else {
        const err = document.getElementById('errorMsg');
        err.style.display = 'block';
        err.textContent = '❌ Invalid email or password. Please try again.';
      }
    }
  </script>
</body>
</html>
