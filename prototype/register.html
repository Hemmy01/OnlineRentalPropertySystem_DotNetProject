<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register – PropRent</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="logo">Prop<span>Rent</span></div>
      <div class="subtitle">South Africa's Property Platform</div>
      <h2>Create Account</h2>

      <div id="errorMsg" style="display:none;background:#fce8e8;color:var(--danger);padding:0.7rem 1rem;border-radius:7px;font-size:0.88rem;margin-bottom:1rem;"></div>

      <form onsubmit="handleRegister(event)">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="regName" placeholder="John Dlamini" required />
        </div>
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="regEmail" placeholder="you@example.com" required />
        </div>
        <div class="form-group">
          <label>Phone Number</label>
          <input type="tel" id="regPhone" placeholder="071 234 5678" required />
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Password</label>
            <input type="password" id="regPassword" placeholder="••••••••" minlength="6" required />
          </div>
          <div class="form-group">
            <label>Confirm Password</label>
            <input type="password" id="regConfirm" placeholder="••••••••" required />
          </div>
        </div>
        <div style="margin-bottom:1.2rem;font-size:0.85rem;">
          <label style="display:flex;align-items:flex-start;gap:0.5rem;cursor:pointer;">
            <input type="checkbox" id="agreeTerms" required style="margin-top:2px;" />
            I agree to the <a href="#" style="color:var(--primary);">Terms of Service</a> and <a href="#" style="color:var(--primary);">Privacy Policy</a>
          </label>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Create Account</button>
      </form>

      <div class="auth-switch">Already have an account? <a href="login.html">Login here</a></div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (DB.currentUser) window.location.href = 'dashboard.html';
    });

    function handleRegister(e) {
      e.preventDefault();
      const name = document.getElementById('regName').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const phone = document.getElementById('regPhone').value.trim();
      const password = document.getElementById('regPassword').value;
      const confirm = document.getElementById('regConfirm').value;
      const err = document.getElementById('errorMsg');

      if (password !== confirm) {
        err.style.display = 'block';
        err.textContent = '❌ Passwords do not match.';
        return;
      }

      const user = register(name, email, password, phone);
      if (user) {
        showToast(`Welcome, ${name.split(' ')[0]}! Account created.`, 'success');
        setTimeout(() => window.location.href = 'dashboard.html', 700);
      } else {
        err.style.display = 'block';
        err.textContent = '❌ An account with this email already exists.';
      }
    }
  </script>
</body>
</html>
